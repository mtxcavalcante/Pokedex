<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <!-- Links -->
     <link rel="icon" href="./Favicon/favicon-16x16.png">
      <link rel="stylesheet" href="./CSS/pokedex.css">

      <!-- Main JS -->
       <script defer src="./JS/pokedex.js"></script>

    <title>Pokedex</title>
</head>
<body>
    
    <main>
        <img src="#" alt="pokemon" class="pokemon_image">

<h1 class="pokemon_data">
        - <span class="pokemon_number"></span> 
        <span class="pokemon_name"></span>
    </h1>

<form class="pokemon_form">
<input 
type="search"
class="input_search"
placeholder="Name or Number"
required
/>
    </form>

    <div class="buttons">
<button class="button btn-prev"> Prev &lt;</button>
<button class="button btn-next"> next &gt;</button>
    </div>

    <img src="./imagens/pokedex.png" alt="pokedex" class="pokedex">
    </main>

</body>
</html>
